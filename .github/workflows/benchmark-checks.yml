name: Benchmark script checks

on:
  push:
    branches: [master, main, develop]
    paths:
      - 'benchmark/**'
      - '.github/workflows/benchmark-checks.yml'
  pull_request:
    paths:
      - 'benchmark/**'
      - '.github/workflows/benchmark-checks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test --prefix benchmark
